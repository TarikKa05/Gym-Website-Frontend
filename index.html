    <script>
    var app = $.spapp({
        defaultView: "#landingPage",
        templateDir: "/views/"
    
    });
    
    
    app.run();


// Get all navbar links
const navLinks = document.querySelectorAll(".nav-link");

// Get the current hash from the URL (e.g., "#landingPage")
const currentHash = window.location.hash;

// Loop through links and add 'active' class if href matches current hash
navLinks.forEach(link => {
    if (link.getAttribute("href") === currentHash) {
        link.classList.add("active");
    }
});

// Optional: Change active link dynamically on scroll or when user clicks a link
window.addEventListener("hashchange", () => {
    // Remove 'active' class from all links
    navLinks.forEach(link => link.classList.remove("active"));

    // Add 'active' class to the currently active link
    const newHash = window.location.hash;
    navLinks.forEach(link => {
        if (link.getAttribute("href") === newHash) {
            link.classList.add("active");
        }
    });
});
</script>
